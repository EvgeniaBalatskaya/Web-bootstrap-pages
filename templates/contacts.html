<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="d-flex">
      <nav class="bg-dark text-white p-3" style="width: 200px;">
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="category1.html">Категория 1</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
      <main class="p-4 flex-grow-1">
        <h1>Контакты</h1>
        <p>Телефон: +7 123 456 7890</p>
        <p>Email: info@example.com</p>
        <p>Адрес: г. Москва, ул. Примерная, д.1</p>
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Ваше имя</label>
            <input type="text" class="form-control" id="name" placeholder="Введите имя">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Введите email">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Сообщение</label>
            <textarea class="form-control" id="message" rows="3" placeholder="Ваше сообщение"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
      </main>
    </div>
  </body>
</html>
